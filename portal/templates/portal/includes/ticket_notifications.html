<!-- Support ticket notifications and customer reply modal -->
<div id="ticket-notification-modal" class="modal-overlay ticket-notification-modal" style="display: none;" aria-hidden="true">
    <div class="modal-card ticket-notification-card" role="dialog" aria-modal="true" aria-labelledby="ticket-notification-title">
        <div class="modal-header ticket-notification-header">
            <div>
                <h3 id="ticket-notification-title">Support Tickets</h3>
                <p>Updates and replies from iConnect Support</p>
            </div>
            <button type="button" id="ticket-notification-close" class="modal-close-btn" title="Close" aria-label="Close notifications">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <section id="ticket-notification-list-view">
            <div id="ticket-notification-loading" class="ticket-notification-empty">Loading your tickets…</div>
            <div id="ticket-notification-empty" class="ticket-notification-empty" hidden>
                <span class="ticket-notification-empty-icon" aria-hidden="true">✓</span>
                <strong>No support tickets yet</strong>
                <span>Tickets you submit from the Help page will appear here.</span>
            </div>
            <div id="ticket-notification-list" class="ticket-notification-list"></div>
        </section>

        <section id="ticket-notification-detail" class="ticket-notification-detail" hidden>
            <button type="button" id="ticket-notification-back" class="ticket-notification-back">
                <span aria-hidden="true">←</span> All tickets
            </button>

            <div class="ticket-notification-detail-heading">
                <div>
                    <span id="ticket-detail-id" class="ticket-detail-id">Ticket</span>
                    <h4 id="ticket-detail-category">Support ticket</h4>
                </div>
                <span id="ticket-detail-status" class="ticket-status ticket-status--pending">Pending</span>
            </div>

            <div class="ticket-detail-block">
                <span class="ticket-detail-label">Your concern</span>
                <p id="ticket-detail-message"></p>
                <time id="ticket-detail-created"></time>
            </div>

            <div id="ticket-detail-reply-block" class="ticket-detail-block ticket-detail-reply">
                <span class="ticket-detail-label">Reply from iConnect Support</span>
                <p id="ticket-detail-reply"></p>
                <time id="ticket-detail-replied"></time>
            </div>
        </section>
    </div>
</div>
